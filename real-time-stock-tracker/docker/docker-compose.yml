# Docker Compose ana orkestrasyon dosyası
# Tüm servisler ve alt sistemler burada tanımlanır.
services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.2.1
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zk-data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.2.1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"    # external
      - "29092:29092"  # internal
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # 1) Dinleyeceği adresler
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092

      # 2) Client’lara nasıl gözükeceği
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092

      # 3) Protokol eşlemesi
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      # 4) Broker–broker iletişimi için internal kullan
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # Her broker’ın log dizinine ayrı volume
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data


  kafka2:
    image: confluentinc/cp-kafka:7.2.1
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
      - "29093:29093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29093,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka2-data:/var/lib/kafka/data


  kafka3:
    image: confluentinc/cp-kafka:7.2.1
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"    # external
      - "29094:29094"  # internal
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # 1) Dinleyeceği adresler
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29094,EXTERNAL://0.0.0.0:9094

      # 2) Client’lara nasıl gözükeceği
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka3:29094,EXTERNAL://localhost:9094

      # 3) Protokol eşlemesi
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT

      # 4) Broker–broker iletişimi için internal kullan
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2

      # Her broker’ın log dizinine ayrı volume
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka3-data:/var/lib/kafka/data


  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    depends_on:
      - kafka
      - kafka2
      - kafka3
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: "Kafka Cluster"
      # UI konteyner içinden INTERNAL adresleriyle erişsin:
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: "kafka:29092,kafka2:29093,kafka3:29094"
  
  airflow-webserver:
    build:
      context: ../airflow
      dockerfile: Dockerfile
    container_name: airflow-web
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__WEBSERVER__EXPOSE_CONFIG=True
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Europe/Istanbul
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-web:8080/execution/
    env_file:
      - ../.env
    volumes:
      - airflow_home:/opt/airflow
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/scripts:/opt/airflow/scripts
    ports:
      - "8082:8080"
    depends_on:
      - kafka
    command: >
      bash -c "airflow db migrate && airflow users create --role Admin --username admin --password admin --email admin@example.com --firstname Admin --lastname User || true && airflow api-server"
    restart: unless-stopped
  
  airflow-scheduler:
    build:
      context: ../airflow
      dockerfile: Dockerfile
    container_name: airflow-scheduler
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Europe/Istanbul
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-web:8080/execution/
    env_file:
      - ../.env
    volumes:
      - airflow_home:/opt/airflow
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/scripts:/opt/airflow/scripts
    depends_on:
      - airflow-webserver
    command: >
      bash -c "airflow db migrate && airflow scheduler"
    restart: unless-stopped

  airflow-triggerer:
    build:
      context: ../airflow
      dockerfile: Dockerfile
    container_name: airflow-triggerer
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Europe/Istanbul
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-web:8080/execution/
    env_file:
      - ../.env
    volumes:
      - airflow_home:/opt/airflow
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/scripts:/opt/airflow/scripts
    depends_on:
      - airflow-webserver
    command: >
      bash -c "airflow db migrate && airflow triggerer"
    restart: unless-stopped

  airflow-dag-processor:
    build:
      context: ../airflow
      dockerfile: Dockerfile
    container_name: airflow-dag-processor
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=false
      - AIRFLOW__CORE__AUTH_MANAGER=airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
      - AIRFLOW__CORE__DEFAULT_TIMEZONE=Europe/Istanbul
      - AIRFLOW__CORE__EXECUTION_API_SERVER_URL=http://airflow-web:8080/execution/
    env_file:
      - ../.env
    volumes:
      - airflow_home:/opt/airflow
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/scripts:/opt/airflow/scripts
    depends_on:
      - airflow-webserver
    command: >
      bash -c "airflow db migrate && airflow dag-processor"
    restart: unless-stopped
  
  fastapi:
    build:
      context: ..
      dockerfile: fastapi-app/Dockerfile
    container_name: stock-fastapi
    env_file:
      - ../.env
    environment:
      - ENABLE_GROQ=false
    ports:
      - "8000:8000"
    depends_on:
      - kafka
      - kafka2
      - kafka3
    restart: unless-stopped
  
  streamlit:
    build:
      context: ../streamlit-app
      dockerfile: Dockerfile
    container_name: stock-dashboard
    environment:
      - API_URL=http://fastapi:8000
    ports:
      - "8501:8501"
    depends_on:
      - fastapi
    restart: unless-stopped
  
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports:
      - "9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer_data:/data
    privileged: true
  
  spark-master:
    image: apache/spark:3.5.3
    container_name: spark-master
    ports:
      - "7077:7077"      # Spark master RPC
      - "8081:8080"      # Web UI (container 8080)
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master", "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    restart: unless-stopped

    # Eğer persistance istenirse volume eklenebilir:
    # volumes:
    #   - spark-master-data:/opt/spark

  spark-worker-1:
    image: apache/spark:3.5.3
    container_name: spark-worker-1
    depends_on:
      - spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077", "--cores", "1", "--memory", "1G", "--webui-port", "8081"]
    restart: unless-stopped
    
volumes:
  zk-data:
  kafka-data:
  kafka2-data:
  kafka3-data:
  portainer_data:
  airflow_home:
  # spark-master-data: